<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="'Noto Sans JP','Yu Gothic UI','Hiragino Kaku Gothic ProN','Meiryo',sans-serif">
<rect width="1200" height="750" fill="#F7F9FC"/>
<rect x="0" y="0" width="1200" height="10" fill="#8AB3DC"/>
